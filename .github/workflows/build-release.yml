name: Build Latest LibreChat Code Interpreter Release Images

on:
  # Check the latest upstream release tag every 6 hours
  schedule:
    - cron: "0 */6 * * *"

  # Support manual triggering
  workflow_dispatch:

# Allow only one complete build workflow at a time
concurrency:
  group: code-interpreter-image-build
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPO: LibreChat-AI/code-interpreter
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:

  # ============================================================
  # 1. Check the latest upstream tag
  # ============================================================
  check:
    name: Check Latest Upstream Tag
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.version.outputs.should_build }}

    steps:

      - name: Get latest upstream release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking upstream repository:"
          echo "https://github.com/${UPSTREAM_REPO}"

          VERSION=$(
            git ls-remote \
              --tags \
              --refs \
              "https://github.com/${UPSTREAM_REPO}.git" \
            | awk -F/ '{print $3}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1
          )

          if [ -z "${VERSION}" ]; then
            echo "ERROR: No valid release tag found."
            exit 1
          fi

          echo "Latest upstream version: ${VERSION}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          # ------------------------------------------------------
          # Check if the API image already exists
          #
          # Only need to check one image.
          # Because all 6 images must be published together as a single version.
          # ------------------------------------------------------

          IMAGE="docker.io/${DOCKERHUB_USERNAME}/librechat-code-interpreter-api:${VERSION}"

          echo "Checking image:"
          echo "${IMAGE}"

          if docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "Image already exists: ${IMAGE}"
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Image does not exist: ${IMAGE}"
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          fi


  # ============================================================
  # 2. Build and push the 6 images
  # ============================================================
  build:
    name: Build ${{ matrix.name }}

    needs: check

    if: needs.check.outputs.should_build == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          # ----------------------------------------------------
          # API
          # ----------------------------------------------------
          - name: api
            image: librechat-code-interpreter-api
            dockerfile: service/Dockerfile
            target: api

          # ----------------------------------------------------
          # Worker
          # ----------------------------------------------------
          - name: worker
            image: librechat-code-interpreter-worker
            dockerfile: service/Dockerfile
            target: worker

          # ----------------------------------------------------
          # Egress Gateway
          # ----------------------------------------------------
          - name: egress-gateway
            image: librechat-code-interpreter-egress-gateway
            dockerfile: service/Dockerfile.egress-gateway
            target: production

          # ----------------------------------------------------
          # Tool Call Server
          # ----------------------------------------------------
          - name: tool-call-server
            image: librechat-code-interpreter-tool-call-server
            dockerfile: service/Dockerfile.tool-call-server
            target: production

          # ----------------------------------------------------
          # Sandbox Runner
          #
          # The official default is KVM_ENABLED=true
          # Corresponds to:
          # target: sandbox-runner-true
          # ----------------------------------------------------
          - name: sandbox-runner
            image: librechat-code-interpreter-sandbox-runner
            dockerfile: api/Dockerfile
            target: sandbox-runner-true

          # ----------------------------------------------------
          # File Server
          # ----------------------------------------------------
          - name: file-server
            image: librechat-code-interpreter-file-server
            dockerfile: service/Dockerfile
            target: production

    steps:

      # --------------------------------------------------------
      # Checkout the specific upstream tag
      # --------------------------------------------------------
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.version }}
          fetch-depth: 1

      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Login Docker Hub
      # --------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------------
      # Build + Push
      # --------------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}

          push: true

          platforms: linux/amd64

          tags: |
            docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ needs.check.outputs.version }}

          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_REPO }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.description=Pre-built Docker image for LibreChat Code Interpreter

          # Independent cache for each image
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
